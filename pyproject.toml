[build-system]
requires = [
    "setuptools>=75.6.0",
    "wheel",
    "coverage",
    "flake8",
    "imagedata>=3.8.0,<3.10"
]
build-backend = "setuptools.build_meta"

[project]
name = "imagedata-format-biff"
version = "0.0.16"
authors = [
    {name = "Erling Andersen", email = "Erling.Andersen@Helse-Bergen.NO"},
]
maintainers = [
    {name = "Erling Andersen", email = "Erling.Andersen@Helse-Bergen.NO"}
]
description = "Imagedata format plugin for biff image data"
readme = "README.rst"
requires-python = ">=3.10,<3.15"
keywords = [
    "python",
    "medical",
    "imaging",
    "biff"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
    "Environment :: Other Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]

license-files = [
    "LICENSE.txt",
]
dependencies = [
    "setuptools",
    "imagedata>=3.8.0,<3.10"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.cibuildwheel]
test-requires = "coverage"
test-command = "coverage run -m unittest discover imagedata_format_biff/tests -t imagedata_format_biff"

[project.entry-points."imagedata_plugins"]
biffformat = "imagedata_format_biff.biffplugin:BiffPlugin"
